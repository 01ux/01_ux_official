<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>景算/Keisan - Official Links</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* --------------------------------------------------
       RESET & BASE STYLES
    -------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: #f1f5f9;
      background-color: #08080a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* --------------------------------------------------
       FADE IN ANIMATION (OPTIMIZED SOFT EFFECT)
    -------------------------------------------------- */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(36px);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .animate-fade {
      opacity: 0;
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 時間差（ディレイ）の設定 */
    .delay-1 { animation-delay: 0.10s; }
    .delay-2 { animation-delay: 0.22s; }
    .delay-3 { animation-delay: 0.34s; }
    .delay-4 { animation-delay: 0.46s; }
    .delay-5 { animation-delay: 0.58s; }
    .delay-6 { animation-delay: 0.70s; }
    .delay-7 { animation-delay: 0.82s; }
    .delay-8 { animation-delay: 0.94s; }
    .delay-9 { animation-delay: 1.06s; }

    /* --------------------------------------------------
       MONOTONE + ORANGE GRADIENT & GRAIN NOISE
    -------------------------------------------------- */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: 
        radial-gradient(circle at 80% 20%, rgba(249, 115, 22, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 20% 75%, rgba(234, 88, 12, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%),
        #08080a;
    }

    /* きめ細かな粒子ノイズ */
    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.22;
      pointer-events: none;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="1.7" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
    }

    /* --------------------------------------------------
       CONTAINER & TYPOGRAPHY
    -------------------------------------------------- */
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .profile-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .artist-name {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #ffffff;
      margin-bottom: 2px;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    }

    .artist-sub {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.45em;
      color: #ea580c;
      text-transform: uppercase;
    }

    /* セクションタイトル */
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: #f8fafc;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.4), transparent);
    }

    .section {
      margin-bottom: 44px;
    }

    /* --------------------------------------------------
       SOCIAL LINKS SECTION
    -------------------------------------------------- */
    .social-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      color: #f1f5f9;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(249, 115, 22, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(249, 115, 22, 0.1);
    }

    .social-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .social-name {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      stroke: #94a3b8;
      transition: transform 0.3s ease, stroke 0.3s ease;
    }

    .social-card:hover .arrow-icon {
      stroke: #f97316;
      transform: translateX(4px);
    }

    /* --------------------------------------------------
       RELEASES SECTION (2-COLUMN GRID)
    -------------------------------------------------- */
    .releases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .release-card {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .release-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(249, 115, 22, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 20px rgba(249, 115, 22, 0.1);
    }

    .release-jacket-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background-color: #121318;
      margin-bottom: 12px;
    }

    .release-jacket {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .release-card:hover .release-jacket {
      transform: scale(1.05);
    }

    .release-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    /* リリース日スタイル */
    .release-date {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .release-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    .listen-badge {
      font-family: 'Syne', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #f97316;
      letter-spacing: 0.08em;
    }

    /* --------------------------------------------------
       FOOTER
    -------------------------------------------------- */
    footer {
      font-family: 'Syne', sans-serif;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #52525b;
      margin-top: 50px;
      letter-spacing: 0.15em;
    }

    /* --------------------------------------------------
       RESPONSIVE ADJUSTMENTS
    -------------------------------------------------- */
    @media (max-width: 520px) {
      body {
        padding: 36px 16px;
      }

      .artist-name {
        font-size: 2.1rem;
      }

      .releases-grid {
        gap: 12px;
      }

      .release-card {
        padding: 12px;
      }

      .release-date {
        font-size: 0.68rem;
      }

      .release-title {
        font-size: 0.92rem;
        margin-bottom: 8px;
      }

      .listen-badge {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <!-- 背景演出 -->
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>

  <div class="container">
    
    <!-- Profile Header -->

    <!-- Social Links Section -->
    <section class="section">

      <div class="social-grid">

            </svg>
            <span class="social-name">TikTok</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

      </div>
    </section>

    <!-- Releases Section -->
    <section class="section">
      <h2 class="section-title animate-fade delay-6">Releases</h2>
      <div class="releases-grid">

        <!-- 夢路スケッチ -->
        <a href="https://linkcloud.mu/fd5726ab" target="_blank" rel="noopener noreferrer" class="release-card animate-fade delay-7">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>

        <!-- 夕景ポリフォニック -->
        <a href="https://linkcloud.mu/a4bebf44" target="_blank" rel="noopener noreferrer" class="release-card animate-fade delay-8">

            <img src="images/2nd.png" alt="夕景ポリフォニック ジャケット" class="release-jacket" loading="lazy">
          </div>
          <div class="release-info">
            <div>
              <span class="release-date">2024.11.01</span>

            <span class="listen-badge">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>

          </div>
        </a>

      </div>
    </section>

    <!-- Footer -->
    <footer class="animate-fade delay-9">
      <p>&copy; KEISAN All Rights Reserved.</p>
    </footer>

  </div>

</body>
</html>
